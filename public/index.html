<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1f2e">
    <meta name="description" content="Herramienta de terreno para contar marcas con visión artificial">
    <title>Contador de Marcas X — Terreno</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="header__brand">
            <span class="header__logo" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 5l14 14M19 5L5 19"/>
                </svg>
            </span>
            <div>
                <h1 class="header__title">CONTADOR X</h1>
                <p class="header__subtitle">Detección en Terreno</p>
            </div>
        </div>
        <span class="header__status" id="connStatus">EN LÍNEA</span>
    </header>

    <main class="main">
        <!-- Zona de captura/preview -->
        <section class="capture" aria-label="Captura de imagen">
            <div class="capture__frame" id="previewFrame">
                <div class="capture__placeholder" id="placeholder">
                    <svg class="capture__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                        <circle cx="12" cy="13" r="4"/>
                    </svg>
                    <p class="capture__hint">Toma una foto de la hoja con marcas</p>
                </div>
                <img id="previewImage" class="capture__image" alt="Vista previa de la imagen capturada" hidden>
            </div>

            <!-- Input oculto: abre la cámara en móvil -->
            <input
                type="file"
                id="cameraInput"
                accept="image/*"
                capture="environment"
                hidden
            >

            <div class="capture__actions">
                <button type="button" class="btn btn--secondary" id="captureBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                        <circle cx="12" cy="13" r="4"/>
                    </svg>
                    <span id="captureBtnText">SACAR FOTO</span>
                </button>
            </div>
        </section>

        <!-- Botón principal: contar -->
        <button type="button" class="btn btn--primary btn--block" id="countBtn" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9 11l3 3L22 4"/>
                <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
            </svg>
            <span>CONTAR MARCAS "X"</span>
        </button>

        <!-- Semáforo de estado -->
        <section class="result" id="resultPanel" aria-live="polite">
            <!-- Estado: idle -->
            <div class="result__state result__state--idle" data-state="idle">
                <div class="result__indicator"></div>
                <div class="result__body">
                    <p class="result__label">ESTADO</p>
                    <p class="result__msg">En espera de imagen</p>
                </div>
            </div>

            <!-- Estado: procesando (oculto por defecto) -->
            <div class="result__state result__state--loading" data-state="loading" hidden>
                <div class="result__spinner" aria-hidden="true"></div>
                <div class="result__body">
                    <p class="result__label">PROCESANDO</p>
                    <p class="result__msg" id="loadingMsg">Analizando imagen...</p>
                </div>
            </div>

            <!-- Estado: éxito (oculto por defecto) -->
            <div class="result__state result__state--success" data-state="success" hidden>
                <p class="result__label">TOTAL DETECTADO</p>
                <p class="result__count" id="totalCount">0</p>
                <p class="result__unit">marcas</p>
                <div class="result__meta">
                    <span class="result__chip">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="12" r="10"/>
                            <polyline points="12 6 12 12 16 14"/>
                        </svg>
                        <span id="responseTime">0 ms</span>
                    </span>
                    <span class="result__chip" id="confChip" hidden>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                            <polyline points="22 4 12 14.01 9 11.01"/>
                        </svg>
                        <span id="confValue">—</span>
                    </span>
                </div>
            </div>

            <!-- Estado: error (oculto por defecto) -->
            <div class="result__state result__state--error" data-state="error" hidden>
                <div class="result__indicator"></div>
                <div class="result__body">
                    <p class="result__label">ERROR</p>
                    <p class="result__msg" id="errorMsg">Sin conexión</p>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <span>v1.0 · Roboflow API</span>
    </footer>

    <script src="app.js" defer></script>
</body>
</html>
